name: release

# Pushing a `v*` tag builds .deb/.rpm/Arch packages and a source tarball with GoReleaser
# and publishes a draft GitHub release whose notes come from git-cliff (plus the optional
# .github/release-notes/<tag>.md). Both tools are
# pinned and checksum-verified by `cargo xtask` (tools/*.toml), so `cargo xtask release`
# reproduces this locally as an unsigned snapshot. A tag with a pre-release suffix
# (e.g. `v0.1.0-beta.1`) is marked as a pre-release.
#
# Artifacts are signed keylessly with Sigstore: cosign signs each package and the
# checksum file with this workflow's OIDC identity (`.sigstore.json` bundles on the
# release), and GitHub records SLSA build provenance for every file in checksums.txt
# (`gh attestation verify FILE --repo dangerousplay/passkey-tpm`).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub release
      id-token: write # Sigstore keyless signing (Fulcio certificate from the OIDC token)
      attestations: write # build provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git-cliff and GoReleaser need the full history and tags
          persist-credentials: false
      - name: Install TPM libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libtss2-dev pkg-config swtpm
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Gate
        run: cargo xtask ci
      - name: Release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        # Optional per-release text (intro, known issues): .github/release-notes/<tag>.md.
        run: |
          args=()
          if [[ -f ".github/release-notes/$TAG.md" ]]; then args=(--tag-message ".github/release-notes/$TAG.md"); fi
          cargo xtask changelog --latest "${args[@]}" --output target/RELEASE_NOTES.md
      - name: Build, sign and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo xtask release --publish
      # git-cliff owns the notes; GoReleaser's changelog is disabled, which also makes it
      # ignore --release-notes, so the body is set here.
      - name: Set release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file target/RELEASE_NOTES.md
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: target/goreleaser/checksums.txt
