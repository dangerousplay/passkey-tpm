name: Problem report
description: Something doesn't work as described (registration, sign-in, PIN, install, ...).
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please don't paste PINs, recovery codes or full credential IDs.
        For security vulnerabilities, use the private security report instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
      placeholder: |
        1. Opened https://webauthn.io in Firefox and clicked Register
        2. Touched the fingerprint reader
        3. The browser said "The operation either timed out or was not allowed"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it fail?
      options:
        - Website / browser
        - pam_u2f (login, sudo)
        - systemd-cryptenroll / disk unlock
        - SSH or other libfido2 tool
        - PIN
        - Fingerprint
        - Installing or starting the services
        - Other
    validations:
      required: true
  - type: input
    id: client
    attributes:
      label: Browser or application and version
      placeholder: Firefox 143, Chromium 141, pam-u2f 1.3.0, ...
  - type: textarea
    id: info
    attributes:
      label: System information
      description: |
        Output of `passkey-tpm-cli info`. For TPM vendor and lockout details, run
        `sudo passkey-tpm-cli info` instead. It contains no secrets or serial numbers.
      render: text
      placeholder: |
        passkey-tpm   0.1.0 (x86_64-linux)
        os            Ubuntu 24.04.1 LTS
        ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Reproduce the problem, then paste the output of:
        `journalctl -b -u passkey-tpm-uvd --since "-10 min"` and
        `journalctl -b --user -u passkey-tpm-agent --since "-10 min"`
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I'm using the latest release (`passkey-tpm-cli version`).
        - label: I searched existing issues.
