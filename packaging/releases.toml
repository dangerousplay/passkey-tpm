# Release history, newest first. The package version itself lives in Cargo.toml
# ([workspace.package] version); `cargo xtask version <new> --summary "..."` bumps it and
# adds an entry here, then renders packaging/templates/ (Debian and Fedora changelogs, Arch
# recipe). `cargo xtask version --check` fails when a rendered file is out of date.

[[release]]
version = "0.1.0-beta.3"
