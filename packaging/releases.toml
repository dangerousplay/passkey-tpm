summary = "Third beta: Firefox sign-in with a username, PIN-only prompts (#5)"

[[release]]
version = "0.1.0-beta.2"
date = "2026-10-13"
summary = "Second beta: tray icon, PIN + presence for users without a fingerprint"

[[release]]
