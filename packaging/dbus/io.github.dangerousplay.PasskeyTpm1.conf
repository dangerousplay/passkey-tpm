<?xml version="1.0"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only the broker's system user may own the name. -->
  <policy user="passkey-tpm">
    <allow own="io.github.dangerousplay.PasskeyTpm1"/>
  </policy>
  <!-- Any local user may call it; the broker derives the uid from the bus and only
       ever acts on that user's credentials. -->
  <policy context="default">
    <allow send_destination="io.github.dangerousplay.PasskeyTpm1"
           send_interface="io.github.dangerousplay.PasskeyTpm1"/>
    <allow send_destination="io.github.dangerousplay.PasskeyTpm1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
