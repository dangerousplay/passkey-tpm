[package]
name = "passkey-tpm-tray"
description = "passkey-tpm tray icon: status and fingerprint enrollment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
zbus = { version = "6.0", default-features = false, features = ["tokio"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "process"] }
tokio-util = "0.7"
notify-rust = { version = "4.18", default-features = false, features = ["z"] }
passkey-tpm-uv = { path = "../uv" }
passkey-tpm-core = { path = "../core" }
passkey-tpm-wire = { path = "../wire" }
sha2 = "0.11"
zeroize = "1.9"

[dev-dependencies]
passkey-tpm-testkit = { path = "../testkit" }
passkey-tpm-tpm = { path = "../tpm" }
passkey-tpm-uvd = { path = "../uvd" }
passkey-tpm-uv = { path = "../uv", features = ["mock"] }
tss-esapi = "7.7"

[lints]
workspace = true
