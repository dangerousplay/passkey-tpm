[package]
name = "passkey-tpm-tray"
description = "passkey-tpm tray icon: status and fingerprint enrollment"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
ksni = { version = "0.3", default-features = false, features = ["tokio"] }
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-util = "0.7"
notify-rust = { version = "4.18", default-features = false, features = ["z"] }
passkey-tpm-uv = { path = "../uv" }

[lints]
workspace = true
