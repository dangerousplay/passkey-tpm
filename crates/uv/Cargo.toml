[package]
name = "passkey-tpm-uv"
description = "User verification providers (fprintd, presence) for passkey-tpm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[features]
mock = []

[dependencies]
zbus = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["rt", "macros", "time", "sync"] }
tokio-util.workspace = true
futures-util.workspace = true
serde.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "process"] }

[[test]]
name = "fprintd"
required-features = ["mock"]

[[example]]
name = "mock-fprintd"
required-features = ["mock"]

[lints]
workspace = true
