[package]
name = "passkey-tpm-uvd"
description = "passkey-tpm privileged broker daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
zbus = { workspace = true, features = ["service"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-util.workspace = true
nix = { workspace = true, features = ["user"] }
passkey-tpm-core.workspace = true
passkey-tpm-tpm.workspace = true
passkey-tpm-uv.workspace = true
tss-esapi.workspace = true

[dev-dependencies]
passkey-tpm-testkit.workspace = true
passkey-tpm-uv = { workspace = true, features = ["mock"] }
passkey-tpm-wire.workspace = true
p256 = { workspace = true, features = ["ecdsa", "std"] }
sha2.workspace = true
futures-util.workspace = true

[lints]
workspace = true
