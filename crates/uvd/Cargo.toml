[package]
name = "passkey-tpm-uvd"
description = "passkey-tpm privileged broker daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
tokio-util = "0.7"
nix = { version = "0.31", default-features = false, features = ["user"] }
passkey-tpm-core = { path = "../core" }
passkey-tpm-tpm = { path = "../tpm" }
passkey-tpm-uv = { path = "../uv" }
tss-esapi = "7.7"

[dev-dependencies]
passkey-tpm-testkit = { path = "../testkit" }
passkey-tpm-uv = { path = "../uv", features = ["mock"] }
passkey-tpm-wire = { path = "../wire" }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
sha2 = "0.11"

[lints]
workspace = true
