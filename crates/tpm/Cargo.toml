[package]
name = "passkey-tpm-tpm"
description = "TPM 2.0 backend for passkey-tpm: policy-bound credential keys and gates"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
tss-esapi = "7.7"
passkey-tpm-core = { path = "../core" }
sha2 = "0.11"
hmac = "0.13"
zeroize = "1.8"
getrandom = "0.4"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
passkey-tpm-wire = { path = "../wire" }

[dev-dependencies]
p256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
sha2 = "0.11"

[lints]
workspace = true
