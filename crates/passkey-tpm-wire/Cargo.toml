[package]
name = "passkey-tpm-wire"
description = "Panic-free wire formats (CBOR, CTAPHID, credential IDs) for passkey-tpm, checked with Kani"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
zeroize = "1.8"

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }

# Panic-freedom crate: workspace lints repeated here (Cargo cannot extend
# `lints.workspace`) plus panic, indexing and arithmetic lints.
[lints.rust]
unsafe_code = "forbid"
renamed_and_removed_lints = "deny"
missing_debug_implementations = "warn"
unused_must_use = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_only)', 'cfg(kani)', 'cfg(fuzzing)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
# Pedantic subset: catches lossy casts and silent truncation, which matter in wire formats.
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"
cast_lossless = "warn"
checked_conversions = "deny"
unchecked_time_subtraction = "deny"
manual_assert = "warn"
missing_errors_doc = "warn"
semicolon_if_nothing_returned = "warn"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "warn"
mem_forget = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
string_slice = "deny"
