[package]
name = "passkey-tpm-cli"
description = "passkey-tpm command line administration tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "passkey-tpm"
path = "src/main.rs"

[dependencies]
passkey-tpm-tpm.workspace = true
passkey-tpm-wire.workspace = true
tss-esapi.workspace = true
passkey-tpm-uv.workspace = true
zbus = { workspace = true, features = ["tokio"] }
tokio = { workspace = true, features = ["rt"] }

[dev-dependencies]
passkey-tpm-testkit.workspace = true
passkey-tpm-uvd.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[lints]
workspace = true
