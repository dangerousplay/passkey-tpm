# git-cliff: changelog and GitHub release notes from conventional commits.
#   cargo xtask changelog              regenerate CHANGELOG.md
#   cargo xtask changelog --latest     notes for the latest tag (used by the release workflow)
#   ... --tag-message FILE             text above the commit list (first line = title, dropped);
#                                      the workflow uses .github/release-notes/<tag>.md if present
# With GITHUB_TOKEN set, entries link PRs and authors and list first-time contributors.

[remote.github]
owner = "dangerousplay"
repo = "passkey-tpm"

[changelog]
header = """
# Changelog

All notable changes to passkey-tpm are documented in this file. The format follows
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and the project uses
[Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
body = """
{%- macro remote_url() -%}
  https://github.com/{{ remote.github.owner }}/{{ remote.github.repo }}
{%- endmacro -%}

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}]({{ self::remote_url() }}/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif %}
{#- Release text: the tag message (or `--tag-message FILE` for the latest release) minus its
    first line, which is the title. #}
{%- if message %}{% set text = message | split(pat="\n") | slice(start=1) | join(sep="\n") | trim %}{% if text %}
{{ text }}
{% endif %}{% endif %}
{%- for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}[**breaking**] {% endif %}\
{{ commit.message | split(pat="\n") | first | trim }}\
{% if commit.remote.username %} by @{{ commit.remote.username }}{% endif %}\
{% if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}]({{ self::remote_url() }}/pull/{{ commit.remote.pr_number }}){% else %} ([{{ commit.id | truncate(length=7, end="") }}]({{ self::remote_url() }}/commit/{{ commit.id }})){% endif %}
{%- endfor %}
{% endfor %}
{%- if github.contributors | filter(attribute="is_first_time", value=true) | length != 0 %}
### New contributors
{% for contributor in github.contributors | filter(attribute="is_first_time", value=true) %}
- @{{ contributor.username }} made their first contribution{% if contributor.pr_number %} in [#{{ contributor.pr_number }}]({{ self::remote_url() }}/pull/{{ contributor.pr_number }}){% endif %}
{%- endfor %}
{% endif %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_preprocessors = [
  # GitHub squash merges append " (#123)"; the PR is linked from remote data instead.
  { pattern = " \\(#[0-9]+\\)$", replace = "" },
]
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^sec|security", group = "<!-- 3 -->Security" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^doc", group = "<!-- 5 -->Documentation" },
  { message = "^test", group = "<!-- 6 -->Testing" },
  { message = "^build|^ci", group = "<!-- 7 -->Build and CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore\\(deps", skip = true },
  { message = "^chore", group = "<!-- 8 -->Miscellaneous" },
]
