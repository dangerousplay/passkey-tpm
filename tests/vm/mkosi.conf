# passkey-tpm VM test bed (AD-014). Built and booted by `cargo xtask vm`.
# Ubuntu 24.04 first; other distributions are added as profiles.

[Distribution]
Distribution=ubuntu
Release=noble
Repositories=main,universe

[Output]
Format=disk
ImageId=passkey-tpm-e2e
OutputDirectory=../../target/vm/output

[Build]
# A tools tree provides apt and ukify on any host distribution.
ToolsTree=default
BuildDirectory=../../target/vm/build
CacheDirectory=../../target/vm/cache
BuildSources=../..:passkey-tpm
# The build script downloads the pinned Rust toolchain and crates.
WithNetwork=yes

[Content]
Bootable=yes
Hostname=passkey-tpm-e2e
Packages=
        linux-image-generic
        systemd
        systemd-sysv
        systemd-boot
        systemd-boot-efi
        systemd-resolved
        udev
        dbus
        polkitd
        fprintd
        libpam-fprintd
        libtss2-esys-3.0.2-0t64
        libtss2-tctildr0t64
        libtss2-mu-4.0.1-0t64
        libtss2-rc0t64
        fido2-tools
        python3
        python3-venv
        acl
        kbd
        tpm2-tools
        tpm-udev
        sudo
BuildPackages=
        build-essential
        pkg-config
        libtss2-dev
        curl
        ca-certificates
        git
        python3-venv
        python3-pip
KernelCommandLine=console=ttyS0 systemd.show_status=error
# Test users: alice (fingerprint enrolled by the runner) and bob (second user).
Autologin=no

[Runtime]
RAM=2G
CPUs=2
KVM=yes
TPM=yes
Console=read-only
# Reports (JUnit, HTML, journal) land in the host's target/vm/report.
RuntimeTrees=../../target/vm/report:/report
